[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    unit: Unit tests for isolated functions and classes
    integration: Integration tests for API endpoints and databases
    slow: Tests that train full machine learning models
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
