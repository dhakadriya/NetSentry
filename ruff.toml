# Ruff Configuration for NetSentry

target-version = "py310"
line-length = 120
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E402",  # module level import not at top of file (sys.path initialization)
    "E501",  # line length handled by formatter
    "E712",  # comparison to True/False in SQLAlchemy filters
    "F401",  # imported but unused
    "F841",  # local variable assigned but never used
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
